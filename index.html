<div class='ref' id='speeds'><h3>SPEEDS</h3><div class='speedgrid'>${[['Vr','55 kt','60 mph'],['Vx','59 kt','68 mph'],['Vy','70 kt','80 mph'],['Vs0','44 kt','49 mph'],['Vs1','50 kt','57 mph'],['Vfe','85 kt','98 mph'],['Va','80 kt','97 mph'],['Vno','128 kt','145 mph'],['Vne','160 kt','182 mph'],['Vref 0F','65 kt','75 mph'],['Vref FF','60 kt','70 mph'],['Glide','65 kt','80 mph']].map(x=>`<div><b>${x[0]}</b><br>${x[1]}<br>${x[2]}</div>`).join('')}</div></div>
<div class='ref' id='comms'><h3>COMMS</h3><table><tr><th>STATION</th><th>FREQUENCY</th></tr><tr><td>KWBW CTAF</td><td><b>122.80</b></td></tr><tr><td>KAVP ATIS</td><td><b>135.75</b></td></tr><tr><td>KAVP VOR</td><td><b>111.6</b></td></tr><tr><td>Wilkes-Barre Approach</td><td><b>120.95</b></td></tr><tr><td>KAVP Tower</td><td><b>120.10</b></td></tr><tr><td>KAVP Ground</td><td><b>121.90</b></td></tr><tr><td>KAVP UNICOM</td><td><b>122.95</b></td></tr><tr><td>Emergency</td><td><b>121.50</b></td></tr></table></div>
<div class='ref' id='weather'><h3>VFR WEATHER MINIMUMS</h3><table><tr><th>ALTITUDE</th><th>AIRSPACE</th><th>VISIBILITY</th><th>CLOUDS</th></tr><tr><td>10,000 MSL</td><td>E</td><td>5 SM</td><td>1,000 below<br>1,000 above<br>1 SM horizontal</td></tr><tr><td>Below 10,000 MSL</td><td>C / D / E</td><td>3 SM</td><td>500 below<br>1,000 above<br>2,000 horizontal</td></tr><tr><td>Below 10,000 MSL</td><td>B</td><td>3 SM</td><td>Clear of clouds</td></tr><tr><td>1,200 AGL or higher</td><td>G (night)</td><td>3 SM</td><td>500 below<br>1,000 above<br>2,000 horizontal</td></tr><tr><td>1,200 AGL or higher</td><td>G (day)</td><td>1 SM</td><td>500 below<br>1,000 above<br>2,000 horizontal</td></tr><tr><td>Below 1,200 AGL</td><td>G (night)</td><td>3 SM</td><td>500 below<br>1,000 above<br>2,000 horizontal</td></tr><tr><td>Below 1,200 AGL</td><td>G (day)</td><td>1 SM</td><td>Clear of clouds</td></tr></table></div>`
function render(data,target,em=false){document.getElementById(target).innerHTML=data.map((s,si)=>`<section class='section ${em?'em':''}'><h2>${s[0]} <span>▾</span></h2><div class='items'>${s[1].map((i,ii)=>`<div class='item' data-key='${target}-${si}-${ii}'><div class='check'></div><div><div class='label'>${i[0]}</div>${i[2]?`<div class='note'>${i[2]}</div>`:''}</div><div class='value'>${i[1]}</div></div>`).join('')}</div></section>`).join('');}
render(normal,'normal');render(emergency,'emergency',true);document.getElementById('reference').innerHTML=refs;['normal','reference','emergency'].forEach(x=>document.getElementById(x).classList.add('hidden'));
function restore(){let st=JSON.parse(localStorage.getItem('c172state')||'{}');document.querySelectorAll('.item').forEach(el=>{if(st[el.dataset.key]){el.classList.add('done');el.querySelector('.check').textContent='✓'}})}restore();
document.addEventListener('click',e=>{let h=e.target.closest('h2');if(h)h.parentElement.classList.toggle('open');let it=e.target.closest('.item');if(it){it.classList.toggle('done');it.querySelector('.check').textContent=it.classList.contains('done')?'✓':'';let st={};document.querySelectorAll('.item.done').forEach(x=>st[x.dataset.key]=1);localStorage.setItem('c172state',JSON.stringify(st));}});
function view(v,sub=true){['normal','reference','emergency'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==v));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.body.classList.toggle('subview',sub);scrollTo(0,0)}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>view(x.dataset.view));document.getElementById('emBtn').onclick=()=>view('emergency');document.getElementById('reset').onclick=()=>{if(confirm('Reset all checked items for a new flight?')){localStorage.removeItem('c172state');document.querySelectorAll('.item').forEach(x=>{x.classList.remove('done');x.querySelector('.check').textContent=''})}};function setTheme(t){document.body.classList.toggle('day',t==='day');localStorage.setItem('c172theme',t);document.getElementById('themeMeta').content=t==='day'?'#f4f6f8':'#07111f'}
document.getElementById('dayTheme').onclick=()=>setTheme('day');document.getElementById('nightTheme').onclick=()=>setTheme('night');setTheme(localStorage.getItem('c172theme')||'day');
document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{view('reference');setTimeout(()=>document.getElementById(b.dataset.ref).scrollIntoView({behavior:'smooth',block:'start'}),20)});document.querySelectorAll('[data-viewquick]').forEach(b=>b.onclick=()=>view(b.dataset.viewquick));document.getElementById('backHome').onclick=()=>{document.body.classList.remove('subview');scrollTo(0,0)};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
